plugins {
    id "fabric-loom" version "1.10.5"
    id "maven-publish"
}

// mcバージョンを自動挿入: gradle.propertiesの mod_version + minecraft_version
version = "${project.mod_version}-mc${project.minecraft_version}"
group = project.maven_group
def resourceVersion = version.toString()

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/releases/"
    }
}

base {
    archivesName = project.archives_base_name
}

loom {
    // 1.18.1's split Loom game jar leaves client resources outside the common development pack.
    // A merged client jar keeps compile-time classes and runClient resources consistent for this legacy target.
    getMinecraftJarConfiguration().set(net.fabricmc.loom.configuration.providers.minecraft.MinecraftJarConfiguration.MERGED)

    sourceSets {
        main {
            java.srcDir("src/client/java")
            resources.srcDir("src/client/resources")
        }
    }

    mods {
        universal_config {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    implementation "com.google.code.gson:gson:${project.gson_version}"
    include "com.google.code.gson:gson:${project.gson_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_jupiter_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${project.junit_platform_version}"
}

processResources {
    inputs.property "version", resourceVersion

    from("NOTICE") {
        into("META-INF")
    }
    from("licenses") {
        into("META-INF/licenses")
    }

    filesMatching("fabric.mod.json") {
        expand "version": resourceVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = "UTF-8"
}

test {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.named("sourcesJar") {
    from("NOTICE") {
        into("META-INF")
    }
    from("licenses") {
        into("META-INF/licenses")
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
