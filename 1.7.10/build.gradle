buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
        maven { url = "https://jitpack.io" }
    }
    dependencies {
        classpath 'com.github.GTNewHorizons:ForgeGradle:1.2.11'
    }
}

apply plugin: 'forge'

version = "1.0.0-mc1.7.10-forge"
group= "com.example.universalconfig"
archivesBaseName = "universal_config"
sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "eclipse"
}

dependencies {
    // you may put jars on which you depend on in ./libs
    // or you may define them like so..
    //compile "some.group:artifact:version:classifier"
    //compile "some.group:artifact:version"
      
    // real examples
    //compile 'com.mod-buildcraft:buildcraft:6.0.8:dev'  // adds buildcraft to the dev env
    //compile 'com.googlecode.efficient-java-matrix-library:ejml:0.24' // adds ejml to the dev env

    // for more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

jar {
    from('LICENSE.txt') {
        into 'META-INF'
        rename { 'LICENSE_universal_config' }
    }
}

// ForgeGradle 1.2 makes runClient depend on jar and recreates build/libs with MCP development names after a
// successful reobf. Keep the hand-off artifact separate so a later test launch cannot silently turn it into a Jar
// that fails on an obfuscated production client.
def distributionJarFile = file("$buildDir/distributions/${archivesBaseName}-${version}.jar")

task distributionJar(dependsOn: reobf) {
    inputs.file jar.archivePath
    outputs.file distributionJarFile

    doLast {
        distributionJarFile.parentFile.mkdirs()
        project.copy {
            from jar.archivePath
            into distributionJarFile.parentFile
            rename { distributionJarFile.name }
        }
    }
}

task verifyDistributionJar(dependsOn: distributionJar) {
    inputs.file distributionJarFile

    doLast {
        def zip = new java.util.zip.ZipFile(distributionJarFile)
        try {
            def entry = zip.getEntry('com/example/universalconfig/forgelegacy/LegacyPlatform.class')
            if (entry == null) {
                throw new GradleException('Distribution Jar is missing LegacyPlatform.class')
            }
            def constantPool = new String(zip.getInputStream(entry).bytes, 'ISO-8859-1')
            if (constantPool.contains('getMinecraft') || constantPool.contains('mcDataDir')) {
                throw new GradleException('Distribution Jar still contains MCP development names')
            }
            if (!constantPool.contains('func_71410_x') || !constantPool.contains('field_71412_D')) {
                throw new GradleException('Distribution Jar does not contain the expected 1.7.10 SRG names')
            }
        } finally {
            zip.close()
        }
    }
}

build.dependsOn verifyDistributionJar

processResources
{
    // this will ensure that this task is redone when the versions change.
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // replace stuff in mcmod.info, nothing else
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
                
        // replace version and mcversion
        expand 'version':project.version, 'mcversion':project.minecraft.version
    }
        
    // copy everything else, thats not the mcmod.info
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}
