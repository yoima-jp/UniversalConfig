plugins {
    id "fabric-loom" version "1.10.5"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group
def resourceVersion = version.toString()

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        universal_config {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "com.google.code.gson:gson:${project.gson_version}"
    include "com.google.code.gson:gson:${project.gson_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_jupiter_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${project.junit_platform_version}"
}

processResources {
    inputs.property "version", resourceVersion

    filesMatching("fabric.mod.json") {
        expand "version": resourceVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = "UTF-8"
}

test {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
