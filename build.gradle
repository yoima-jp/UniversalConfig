plugins {
    id 'base'
}

group = 'com.example.universalconfig'
version = '1.0.0'

// The root project intentionally owns no Java source set. Every Minecraft version is a standalone
// Gradle project with its own wrapper, sources, tests, resources, dependencies, and distribution Jar.
tasks.register('verifyIndependentVersions') {
    doLast {
        def versions = ['1.7.10', '1.8.9', '1.12.2', '1.16.5', '1.18.2', '1.19.2',
                        '1.20.1', '1.21.1', '26.1.x', '26.2']
        versions.each { version ->
            def projectDirectory = file(version)
            if (!new File(projectDirectory, 'gradlew.bat').isFile()
                    || !new File(projectDirectory, 'build.gradle').isFile()
                    || !new File(projectDirectory, 'src/main/java').isDirectory()
                    || !new File(projectDirectory, 'LICENSE.txt').isFile()) {
                throw new GradleException("Standalone project is incomplete: ${version}")
            }

            fileTree(projectDirectory) {
                include 'build.gradle', 'settings.gradle', 'gradle.properties'
                exclude 'build/**', '.gradle/**'
            }.each { configurationFile ->
                def contents = configurationFile.getText('UTF-8')
                if (contents.contains('../') || contents.contains('common/src') || contents.contains('legacy/src')) {
                    throw new GradleException("External project reference found: ${configurationFile}")
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyIndependentVersions')
}
