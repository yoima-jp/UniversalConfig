name: Build

on:
  push:
    branches:
      - forge
  pull_request:
    branches:
      - forge

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate project layout
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Verify standalone projects
        run: bash ./gradlew check --no-daemon

  build:
    name: Forge ${{ matrix.version }} (Java ${{ matrix.java }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 1.7.10
            java: "8"
            os: ubuntu-22.04
          - version: 1.8.9
            java: "8"
            os: ubuntu-22.04
          - version: 1.12.2
            java: "8"
            os: ubuntu-24.04
          - version: 1.16.5
            java: "17"
            os: ubuntu-24.04
          - version: 1.18.2
            java: "17"
            os: ubuntu-24.04
          - version: 1.19.2
            java: "17"
            os: ubuntu-24.04
          - version: 1.20.1
            java: "17"
            os: ubuntu-24.04
          - version: 1.21.1
            java: "21"
            os: ubuntu-24.04
          - version: 26.1.x
            java: "25"
            os: ubuntu-24.04
          - version: "26.2"
            java: "25"
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Build and test Forge ${{ matrix.version }}
        run: cd "${{ matrix.version }}" && bash ./gradlew build --no-daemon

  required:
    name: Required
    if: always()
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "${VALIDATE_RESULT}" = "success" && test "${BUILD_RESULT}" = "success"
