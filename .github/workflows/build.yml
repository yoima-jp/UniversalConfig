name: Build

on:
  push:
    branches:
      - forge
  pull_request:
    branches:
      - forge

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify standalone projects
        run: bash ./gradlew check

      - name: Build latest Forge version
        run: cd 26.2 && bash ./gradlew build
