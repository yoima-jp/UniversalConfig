name: Build

on:
  push:
    branches:
      - main
      - fabric
  pull_request:
    branches:
      - main
      - fabric

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check and build Fabric 26.2
        run: |
          bash ./gradlew check
          bash ./gradlew build
        working-directory: 26.2
