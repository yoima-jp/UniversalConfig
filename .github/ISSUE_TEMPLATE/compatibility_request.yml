name: Compatibility / version support
description: Report a compatibility problem or request support for a Minecraft version, loader, or mod
title: "[Compatibility]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for compatibility problems and version/loader support requests.
        If Universal Config itself is crashing or behaving incorrectly without a specific compatibility concern, use the Bug report form instead.

  - type: dropdown
    id: request-type
    attributes:
      label: Request type
      options:
        - Compatibility with another mod
        - Minecraft version support
        - Mod loader support
        - Launcher / modpack compatibility
        - Other
    validations:
      required: true

  - type: input
    id: universal-config-version
    attributes:
      label: Universal Config version
      description: If you are requesting support for a currently unsupported version, enter N/A if necessary.
      placeholder: e.g. 1.0.0 or N/A
    validations:
      required: true

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      placeholder: e.g. 1.12.2, 1.20.1, 1.21.1
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Mod loader
      options:
        - Fabric
        - Forge
        - NeoForge
        - Other / not applicable
    validations:
      required: true

  - type: input
    id: related-mod
    attributes:
      label: Related mod / launcher / modpack
      description: Name and version, if applicable.
      placeholder: e.g. Mod Name 2.3.1, Prism Launcher 11.x

  - type: input
    id: related-link
    attributes:
      label: Related project link
      description: Link to the relevant mod, launcher, or project page if applicable.
      placeholder: https://...

  - type: textarea
    id: behavior
    attributes:
      label: What should be supported or fixed?
      description: Explain the compatibility problem or the support you are requesting.
      placeholder: Describe the current behavior and the desired behavior.
    validations:
      required: true

  - type: textarea
    id: config-details
    attributes:
      label: Relevant config / profile details
      description: If this involves a mod configuration file, profile, keybind, or settings migration, describe the relevant files and behavior.
      placeholder: e.g. config/example.toml is not restored correctly between instances

  - type: textarea
    id: logs
    attributes:
      label: Logs / additional context
      description: Add logs, screenshots, links, or other details that may help investigate the request.
