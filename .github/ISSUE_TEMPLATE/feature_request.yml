name: Feature request
description: Suggest a new feature or improvement for Universal Config
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.
        Please describe the problem first, then the solution you would like to see.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find the same request.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or limitation
      description: What problem are you trying to solve? Explain the use case rather than only naming a feature.
      placeholder: Describe what is difficult, missing, repetitive, or confusing today.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you think Universal Config should solve the problem.
      placeholder: Describe the behavior, UI, workflow, or setting you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: If applicable, describe any workarounds or alternative designs you considered.

  - type: input
    id: minecraft-version
    attributes:
      label: Relevant Minecraft version(s)
      description: Leave blank if the request is version-independent.
      placeholder: e.g. 1.20.1, 1.21.1, all versions

  - type: dropdown
    id: loader
    attributes:
      label: Relevant mod loader
      options:
        - All / loader-independent
        - Fabric
        - Forge
        - NeoForge
        - Other

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add mockups, screenshots, examples from other mods, or any other useful context.
