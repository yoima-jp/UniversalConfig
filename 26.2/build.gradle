plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '7.0.32'
}

version = '1.0.0-mc26.2-forge'
group = 'com.example.universalconfig'
base.archivesName = 'universal-config'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    accessTransformer.from(file('src/main/resources/META-INF/accesstransformer.cfg'))

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'universal_config'
        }
        register('client')
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.2-65.1.0')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test', Test) { useJUnitPlatform() }
tasks.named('jar', Jar) {
    from('LICENSE.txt') { into 'META-INF'; rename { 'LICENSE_universal_config' } }
    manifest {
        attributes('Specification-Title': 'universal_config',
                'Specification-Vendor': 'yoima-jp, tofuturu, tanzana7',
                'Specification-Version': '1',
                'Implementation-Title': 'Universal Config',
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'yoima-jp, tofuturu, tanzana7')
    }
}
